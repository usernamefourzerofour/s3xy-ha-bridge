name: S3XY virtual button
version: "0.3.0"
slug: s3xy_button
description: Control an S3XY Commander from Home Assistant via a virtual Bluetooth button (ENH_BTN)
url: https://github.com/usernamefourzerofour/s3xy-ha-bridge
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
host_dbus: true
services:
  - mqtt:need
options:
  bt_adapter: ""
  btn_name: ENH_BTN
schema:
  bt_adapter: str?
  btn_name: str
