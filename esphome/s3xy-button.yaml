# S3XY virtual button for ESPHome (package)
#
# An ESP32 near the car pretends to be the Enhance Auto ENH_BTN Bluetooth button,
# so Home Assistant can press it through the native ESPHome API (no MQTT, no add-on).
# Protocol: see CLAUDE.md, ported from Beat-YT/s3xy-virtual-button (MIT).
#
# This file only holds the S3XY part. Add it to the YAML that ESPHome Device Builder
# created for your device (which has Wi-Fi, API and OTA):
#
#   packages:
#     s3xy: github://usernamefourzerofour/s3xy-ha-bridge/esphome/s3xy-button.yaml@main
#
# Needs an original ESP32, ESP32-S3 or ESP32-C3 (not ESP32-S2: no Bluetooth),
# the esp-idf framework and ESPHome 2026.11 or newer.

esphome:
  min_version: 2026.11.0

substitutions:
  s3xy_firmware_version: "0.1.4"
  s3xy_button_id: SABRINASNS

external_components:
  - source: github://usernamefourzerofour/s3xy-ha-bridge@main
    components: [s3xy_ble_security]
    refresh: always

s3xy_ble_security:
  id: s3xy_link
  notify_id: notify_char

# Same security as the real button: LE Secure Connections + bonding, "Just Works", 16-byte key
esp32_ble:
  name: ENH_BTN
  io_capability: none
  auth_req_mode: sc_bond
  max_key_size: 16

esp32_ble_server:
  id: ble_srv
  max_clients: 1
  services:
    - uuid: 00003d46-87d2-479e-7e45-8551415a6de1
      advertise: true
      characteristics:
        # Button events are notified here
        - id: notify_char
          uuid: 00003d50-87d2-479e-7e45-8551415a6de1
          read: true
          notify: true
          value:
            data: [0x00]
          descriptors:
            # A quoted four-character UUID produces a 16-bit CCCD on the wire.
            - uuid: "2902"
              read: true
              write: true
              value: [0x00, 0x00]
        # Button ID; the Commander writes its commands here
        - id: id_char
          uuid: 00003d49-87d2-479e-7e45-8551415a6de1
          read: true
          write: true
          read_encrypt: true
          write_encrypt: true
          value:
            data: ${s3xy_button_id}
          on_write:
            then:
              - lambda: |-
                  // x = written bytes, id = connection id
                  ESP_LOGI("s3xy", "ID write: %s", format_hex_pretty(x).c_str());
                  if (x.size() == 1 && x[0] == 0xB6) {          // init / version check
                    id(s3xy_link)->reply_to_init();
                  } else if (x.size() == 1 && x[0] == 0xA1) {   // unpair -> disconnect
                    ESP_LOGI("s3xy", "Commander requested unpair -> disconnect");
                    id(s3xy_link)->unpair(id);
                  } else if (x.size() == 4 && x[0] == 0xA4) {   // rename
                    id(s3xy_link)->reply_to_rename(x[1], x[2]);
                  }
  on_connect:
    - logger.log: "Commander connected"
    - binary_sensor.template.publish:
        id: commander_connected
        state: true
  on_disconnect:
    - logger.log: "Commander disconnected"
    - script.stop: press_single
    - ble_server.characteristic.set_value:
        id: id_char
        value: ${s3xy_button_id}
    - ble_server.characteristic.set_value:
        id: notify_char
        value: [0x00]
    - binary_sensor.template.publish:
        id: commander_connected
        state: false

binary_sensor:
  - platform: template
    id: commander_connected
    name: Commander connected
    device_class: connectivity

script:
  # Single: 01, 00, C1 01, 00
  - id: press_single
    mode: queued
    then:
      - if:
          condition:
            lambda: return id(s3xy_link)->ready_for_press();
          then:
            - logger.log:
                level: INFO
                tag: s3xy
                format: "Sending single press"
            - ble_server.characteristic.set_value:
                id: notify_char
                value: [0x01]
            - ble_server.characteristic.notify:
                id: notify_char
            - delay: 10ms
            - ble_server.characteristic.set_value:
                id: notify_char
                value: [0x00]
            - ble_server.characteristic.notify:
                id: notify_char
            - delay: 10ms
            - ble_server.characteristic.set_value:
                id: notify_char
                value: [0xC1, 0x01]
            - ble_server.characteristic.notify:
                id: notify_char
            - delay: 10ms
            - ble_server.characteristic.set_value:
                id: notify_char
                value: [0x00]
            - ble_server.characteristic.notify:
                id: notify_char
  # Double: C1 02
  - id: press_double
    mode: queued
    then:
      - if:
          condition:
            lambda: return id(s3xy_link)->ready_for_press();
          then:
            - logger.log:
                level: INFO
                tag: s3xy
                format: "Sending double press"
            - ble_server.characteristic.set_value:
                id: notify_char
                value: [0xC1, 0x02]
            - ble_server.characteristic.notify:
                id: notify_char
  # Long: C3 01
  - id: press_long
    mode: queued
    then:
      - if:
          condition:
            lambda: return id(s3xy_link)->ready_for_press();
          then:
            - logger.log:
                level: INFO
                tag: s3xy
                format: "Sending long press"
            - ble_server.characteristic.set_value:
                id: notify_char
                value: [0xC3, 0x01]
            - ble_server.characteristic.notify:
                id: notify_char

button:
  - platform: template
    name: Press
    icon: mdi:gesture-tap
    on_press:
      - script.execute: press_single
  - platform: template
    name: Double press
    icon: mdi:gesture-double-tap
    on_press:
      - script.execute: press_double
  - platform: template
    name: Long press
    icon: mdi:gesture-tap-hold
    on_press:
      - script.execute: press_long
